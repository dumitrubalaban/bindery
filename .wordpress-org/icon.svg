<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bindery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d34d12"/>
      <stop offset="1" stop-color="#a8350a"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square badge -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <!-- A content "card" = the region you make editable -->
  <rect x="48" y="64" width="160" height="128" rx="18" fill="#fbf3ea"/>
  <!-- Dashed outline = the editable affordance the plugin shows -->
  <rect x="48" y="64" width="160" height="128" rx="18" fill="none" stroke="#c2410c" stroke-width="5" stroke-dasharray="13 9"/>
  <!-- Text lines (a serif-y headline + body) -->
  <rect x="74" y="92"  width="92" height="16" rx="8" fill="#1b1712"/>
  <rect x="74" y="124" width="108" height="9" rx="4.5" fill="#b9b0a4"/>
  <rect x="74" y="142" width="80"  height="9" rx="4.5" fill="#b9b0a4"/>
  <!-- Editing caret -->
  <rect x="170" y="86" width="5" height="28" rx="2.5" fill="#c2410c"/>
</svg>
