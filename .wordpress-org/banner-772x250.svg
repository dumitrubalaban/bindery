<svg width="772" height="250" viewBox="0 0 772 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bindery — make any theme client-editable">
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfaf5"/>
      <stop offset="1" stop-color="#f6efe4"/>
    </linearGradient>
  </defs>
  <rect width="772" height="250" fill="url(#banner-bg)"/>

  <!-- Left: wordmark + tagline -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="60" y="118" font-size="58" font-weight="700" fill="#1b1712" letter-spacing="-1">Bindery</text>
  </g>
  <rect x="62" y="132" width="64" height="5" rx="2.5" fill="#c2410c"/>
  <text x="62" y="168" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#5d564d">Make any theme client-editable.</text>
  <text x="62" y="196" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#8c8378">Clean markup. No page builder. Multilingual.</text>

  <!-- Right: a mock editable region (what the plugin does) -->
  <g transform="translate(486,44)">
    <rect x="0" y="0" width="236" height="162" rx="16" fill="#ffffff" stroke="#ece4d8" stroke-width="1.5"/>
    <!-- the editable region, outlined dashed -->
    <rect x="22" y="26" width="192" height="64" rx="10" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="38" y="58" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1b1712">Edit me</text>
    <rect x="148" y="38" width="4" height="26" rx="2" fill="#c2410c"/>
    <!-- body lines -->
    <rect x="22" y="106" width="150" height="9" rx="4.5" fill="#e7ded2"/>
    <rect x="22" y="124" width="110" height="9" rx="4.5" fill="#e7ded2"/>
    <!-- little CTA button -->
    <rect x="150" y="116" width="64" height="26" rx="7" fill="#c2410c"/>
  </g>
</svg>
